# background
set -g status-style "bg=#181818,fg=#b8b8c0,none"
set -g status-left-style "bg=#181818,fg=#b8b8c0,none"
set -g status-right-style "bg=#181818,fg=#b8b8c0,none"

# curr window
set -g window-status-style "bg=#181818,fg=#b8b8c0,none"
set -g window-status-current-style "bg=#181818,fg=#e4e4ef,none"
set -g window-status-activity-style "bg=#181818,fg=#ffdd33,none"
set -g window-status-bell-style "bg=#181818,fg=#c73c3f,none"

# nofoc window
set -g pane-border-style "fg=#4c4c58"
set -g pane-active-border-style "fg=#8b8b99"

# command prompts
set -g message-style "bg=#181818,fg=#e4e4ef,none"
set -g message-command-style "bg=#181818,fg=#e4e4ef,none"
set -g mode-style "bg=#484848,fg=#e4e4ef,none"
set -g status-right ""
