set -g mouse on
bind-key -n C-f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
set -g update-environment "DISPLAY SSH_AUTH_SOCK SSH_AGENT_PID DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR WAYLAND_DISPLAY"

set -g base-index 1
setw -g pane-base-index 1

set -ga terminal-overrides ",*:Tc"

set -g status on
set -g status-bg default
set -g status-fg "#e4e4e4"
set -g status-justify left
set -g status-style "none"
set -g status-position bottom

set -g status-left-length 20
set -g status-right-length 20
set -g status-left  "#[fg=#e4e4e4]#S "
set -g status-right "#[fg=#e4e4e4]%H:%M "

set -g window-status-format " #[fg=#777]#I:#W "
set -g window-status-current-format " #[bold,underscore,fg=#ffdd33]#I:#W#[default] "
setw -g window-status-current-style fg=#ffdd33

set -g pane-border-style "fg=#e4e4e4"
set -g pane-active-border-style "fg=#e4e4e4"
setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
